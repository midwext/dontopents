<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />

  <title>tex totten</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #f5f5f5;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
    }

    /* Animated star canvas */
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Soft vignette */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(0, 0, 0, 0.12) 55%,
          rgba(0, 0, 0, 0.7) 100%
        );
    }

    
    /* Very subtle texture */
    .grain {
      position: fixed;
      inset: -50%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.025;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");

      animation: grain 0.3s steps(2) infinite;
    }

    @keyframes grain {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(2%, -1%);
      }

      50% {
        transform: translate(-1%, 2%);
      }

      75% {
        transform: translate(1%, 1%);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    main {
      position: relative;
      z-index: 3;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px;
    }

    .content {
      width: min(900px, 100%);
      text-align: center;

      opacity: 0;
      transform: translateY(12px);

      animation: appear 1.25s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name {
      font-size: clamp(3.2rem, 11vw, 8.5rem);
      font-weight: 500;
      letter-spacing: -0.065em;
      line-height: 0.9;
      text-transform: lowercase;
    }

    .cursor {
      display: inline-block;
      width: 0.06em;
      height: 0.76em;

      margin-left: 0.07em;

      background: currentColor;

      vertical-align: 0.02em;

      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      0%,
      47% {
        opacity: 1;
      }

      48%,
      100% {
        opacity: 0;
      }
    }

    .quote {
      margin-top: 42px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(1.05rem, 2.6vw, 1.6rem);
      line-height: 1.55;

      letter-spacing: 0.015em;

      color: rgba(255, 255, 255, 0.76);
    }

    .quote span {
      display: block;
    }

    .link {
      display: inline-block;

      margin-top: 40px;

      color: rgba(255, 255, 255, 0.48);

      font-size: 0.78rem;
      font-weight: 500;

      letter-spacing: 0.22em;
      text-transform: uppercase;

      text-decoration: none;

      transition:
        color 180ms ease,
        transform 180ms ease;
    }

    .link::after {
      content: " ↗";
    }

    .link:hover,
    .link:focus-visible {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .link:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.6);
      outline-offset: 8px;
    }

    .footer {
      position: fixed;

      left: 50%;
      bottom: 22px;

      z-index: 3;

      transform: translateX(-50%);

      color: rgba(255, 255, 255, 0.2);

      font-size: 0.63rem;

      letter-spacing: 0.25em;
      text-transform: uppercase;

      white-space: nowrap;
    }

    @media (max-width: 600px) {
      main {
        padding: 24px;
      }

      .name {
        font-size: clamp(3.4rem, 19vw, 6rem);
      }

      .quote {
        margin-top: 34px;
      }

      .link {
        margin-top: 34px;
      }

      .footer {
        bottom: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content {
        opacity: 1;
        transform: none;
        animation: none;
      }

      .cursor,
      .grain {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="vignette"></div>
  <div class="grain"></div>

  <main>
    <section class="content">

      <h1 class="name">
        tex totten<span class="cursor"></span>
      </h1>

      <p class="quote">
        <span>don’t tell delilah</span>
        <span>where your strength lies</span>
      </p>

      <a
        class="link"
        href="https://linktr.ee/tex23"
        target="_blank"
        rel="noopener noreferrer"
      >
        linktree
      </a>

    </section>
  </main>

  <div class="footer">
    textotten.com
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("stars");
      const ctx = canvas.getContext("2d");

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      let width = 0;
      let height = 0;
      let dpr = 1;

      let stars = [];

      let mouseX = 0;
      let mouseY = 0;

      let targetMouseX = 0;
      let targetMouseY = 0;

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createStar() {
        return {
          x: Math.random() * width,
          y: Math.random() * height,

          radius: random(0.3, 1.35),

          baseAlpha: random(0.18, 0.8),

          twinkleSpeed: random(0.0007, 0.0025),

          phase: Math.random() * Math.PI * 2,

          depth: random(0.15, 1)
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        /*
          More screen space = more stars.
          Still capped so mobile performance stays good.
        */
        const amount = Math.min(
          240,
          Math.max(
            90,
            Math.floor((width * height) / 7000)
          )
        );

        stars = Array.from(
          { length: amount },
          createStar
        );
      }

      function draw(time = 0) {
        ctx.clearRect(0, 0, width, height);

        /*
          Smooth mouse movement instead of stars instantly
          snapping when the pointer moves.
        */
        mouseX += (targetMouseX - mouseX) * 0.035;
        mouseY += (targetMouseY - mouseY) * 0.035;

        for (const star of stars) {
          let alpha = star.baseAlpha;

          if (!reduceMotion) {
            alpha +=
              Math.sin(
                time * star.twinkleSpeed + star.phase
              ) * 0.17;
          }

          alpha = Math.max(
            0.05,
            Math.min(alpha, 0.95)
          );

          const offsetX =
            reduceMotion
              ? 0
              : mouseX * star.depth * 8;

          const offsetY =
            reduceMotion
              ? 0
              : mouseY * star.depth * 8;

          let x = star.x + offsetX;
          let y = star.y + offsetY;

          /*
            Wrap stars if parallax pushes them outside
            the screen.
          */
          if (x < -5) x += width + 10;
          if (x > width + 5) x -= width + 10;

          if (y < -5) y += height + 10;
          if (y > height + 5) y -= height + 10;

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            star.radius,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            `rgba(255,255,255,${alpha})`;

          ctx.fill();
        }

        if (!reduceMotion) {
          requestAnimationFrame(draw);
        }
      }

      window.addEventListener(
        "pointermove",
        (event) => {
          targetMouseX =
            event.clientX / width - 0.5;

          targetMouseY =
            event.clientY / height - 0.5;
        },
        { passive: true }
      );

      /*
        Tiny parallax on phones when supported.
        It does NOT request special permissions.
      */
      window.addEventListener(
        "deviceorientation",
        (event) => {
          if (
            typeof event.gamma !== "number" ||
            typeof event.beta !== "number"
          ) {
            return;
          }

          targetMouseX = Math.max(
            -0.5,
            Math.min(0.5, event.gamma / 70)
          );

          targetMouseY = Math.max(
            -0.5,
            Math.min(0.5, (event.beta - 45) / 100)
          );
        },
        { passive: true }
      );

      window.addEventListener(
        "resize",
        () => {
          resize();

          if (reduceMotion) {
            draw(0);
          }
        },
        { passive: true }
      );

      resize();

      if (reduceMotion) {
        draw(0);
      } else {
        requestAnimationFrame(draw);
      }
    })();
  </script>

</body>
</html>
